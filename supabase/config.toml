# Настройки проекта Supabase (нужны, если вы используете Supabase CLI)
project_id = "fizzarollio"

[functions.claim-card]
verify_jwt = false   # токен проверяется внутри функции (getUser), так надёжнее для новых ключей

[auth]
enable_signup = true
enable_confirmations = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
